name: Build Kernel

on:
  workflow_call:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # Step 1: Update dependencies
      - name: Update dependencies
        run: |
          set -e
          sudo apt update
          sudo apt install -y build-essential bc flex bison libncurses5-dev libssl-dev git ccache python2 libtinfo5
          if [ ! -f /usr/bin/python2.7 ]; then
            echo "Python 2.7 not found!"
            exit 1
          fi
          sudo rm -f /usr/bin/python
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          python --version

      # Step 2: Checkout repository
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Step 3: Install GCC and Clang toolchains
      - name: Install GCC and Clang
        run: |
          set -e
          mkdir -p toolchain/gcc/linux-x86/aarch64 toolchain/llvm-arm-toolchain-ship/10.0
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git clone https://github.com/proprietary-stuff/llvm-arm-toolchain-ship-10.0 toolchain/llvm-arm-toolchain-ship/10.0

      # Step 4: Build kernel
      - name: Build Kernel
        run: |
          set -e
          export DTC_EXT=dtc
          export LLVM=1
          export LLVM_IAS=1
          make_args="-j$(nproc --all) \
                     O=out \
                     ARCH=arm64 \
                     CLANG_TRIPLE=aarch64-linux-gnu- \
                     CROSS_COMPILE=$(pwd)/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android- \
                     REAL_CC=$(pwd)/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang"
          make ${make_args} a70_defconfig
          make ${make_args}

      # Step 5: Build AnyKernel3
      - name: Build AnyKernel3
        run: |
          set -e
          git clone https://github.com/CCCC-L/anyKernel3 releases
          sed -i "s/{branch}/${{ github.ref_name }}/g" releases/anykernel.sh
          rm -rf releases/.git
          mv out/arch/arm64/boot/Image releases/
